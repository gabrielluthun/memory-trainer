# Production: after a release or hotfix pull request is merged into main.
# Order: build, full export to R2, migrations, authorized account, publication, backup Worker.
# Stops at the first failure (ES19, docs/06-qualite-deploiement/deploiement.md).
name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

# One production run at a time; a second one waits instead of cancelling the first.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Export, migrate, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Production secrets only exist in this environment, restricted to the main branch (ES11).
    environment: production
    env:
      # Must follow the PostgreSQL major version of the Neon project (checked when it is created).
      PG_MAJOR: '18'
      DBMATE_VERSION: 2.38.2
      DBMATE_SHA256: 4c6059e4e52558605d39e8c8075f3b15f96cac293043c0c71bb464d8950f235c
      PAGES_PROJECT: memory-trainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: 1. Build
        # Public addresses (ES08), kept as variables of the production environment, not secrets.
        env:
          PUBLIC_HANKO_API_URL: ${{ vars.PUBLIC_HANKO_API_URL }}
          PUBLIC_DATA_API_URL: ${{ vars.PUBLIC_DATA_API_URL }}
        run: npm run build

      - name: Install the PostgreSQL client matching Neon
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Install dbmate (pinned version, checked against its checksum)
        run: |
          curl -fsSL -o dbmate \
            "https://github.com/amacneil/dbmate/releases/download/v${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  dbmate" | sha256sum --check --strict
          chmod +x dbmate && sudo mv dbmate /usr/local/bin/dbmate

      - name: 2. Full export to R2, before any migration (ES19)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          version=$(node -p "require('./package.json').version")
          file="pre-migration/$(date -u +%Y%m%dT%H%M%SZ)-v${version}-${GITHUB_SHA::7}.dump"
          pg_dump --format=custom --file=export.dump "$DATABASE_URL"
          aws s3 cp export.dump "s3://${R2_BUCKET}/${file}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          rm export.dump
          echo "Export saved as ${file}"

      - name: 3. Migrations (dbmate, one transaction each, under a lock)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run db:up

      - name: 4. Authorized account (idempotent)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          AUTHORIZED_ACCOUNT_ID: ${{ secrets.AUTHORIZED_ACCOUNT_ID }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v owner_id="$AUTHORIZED_ACCOUNT_ID" -f db/scripts/create-account.sql

      - name: 5. Publication on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

      - name: 6. Backup Worker (code, daily schedule, then its database secret)
        # ADR 0032: bound to the private bucket, whose name is a production secret; the database
        # address with the read-only backup_reader role is sent as a secret of the Worker.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "workers/backup/wrangler.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.r2_buckets[0].bucket_name = process.env.R2_BUCKET;
            fs.writeFileSync(file, JSON.stringify(config, null, "\t"));
          '
          npx wrangler deploy --config workers/backup/wrangler.json
          printf '%s' "$BACKUP_DATABASE_URL" | npx wrangler secret put BACKUP_DATABASE_URL --config workers/backup/wrangler.json
