# Checks: every push and every pull request, without any secret.
# Merging into main requires all these jobs to be green (docs/06-qualite-deploiement/deploiement.md).
name: Checks

on:
  push:
    branches: [develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Read-only token; no job gets more (ES11).
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, audit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Simulated service, as in the end-to-end tests: the build requires an address (src/env.ts).
      PUBLIC_HANKO_API_URL: https://hanko.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only, ES14)
        run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Types
        run: npm run check
      - name: Unit, integration and database tests, with the domain coverage threshold
        run: npm run test:coverage
      - name: Dependency audit (blocks from high severity)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright (Chromium, Firefox, WebKit, emulated devices)
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checked against its checksum)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the whole history (ES09)
        run: ./gitleaks git --redact --verbose --no-banner
